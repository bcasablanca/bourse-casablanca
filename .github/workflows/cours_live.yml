name: Cours de la seance (portefeuille)

on:
  schedule:
    # Secours : toutes les 15 min de 08:07 a 15:52 UTC, du lundi au vendredi
    # (couvre la seance que le Maroc soit a UTC+0 ou UTC+1). Minutes decalees
    # de l'heure pile, moins chargee chez GitHub. GitHub peut quand meme
    # retarder ou sauter des passages : le Portefeuille lance donc aussi
    # cette tache a la demande (onglet Seance).
    - cron: "7,22,37,52 8-15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: depot-bourse
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests certifi

      - name: Script 9 - Cours de la seance
        run: python 9_cours_live.py

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cours_live.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Cours seance $(date -u +%H:%M) UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
